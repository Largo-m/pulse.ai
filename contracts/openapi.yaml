openapi: 3.0.3
info:
  title: Pulse Engine API
  version: 0.1.0
paths:
  /api/status:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/doctor:
    get:
      summary: Environment checks
      responses:
        "200":
          description: Check results
  /api/workflows:
    get:
      summary: List workflows defined in the database
      responses:
        "200":
          description: Workflow definitions, each with its ordered steps
  /api/workflows/{workflow_id}/runs:
    post:
      summary: Start a workflow run
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                workspace:
                  type: string
                  nullable: true
                resume_run_id:
                  type: string
                  nullable: true
                  description: Resume a previous run instead of creating one
                restart:
                  type: boolean
                  default: false
                  description: With resume_run_id, redo every step from the first
      responses:
        "200":
          description: Run created
        "404":
          description: Unknown workflow id
  /api/runs/{run_id}:
    get:
      summary: Get run status
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run state
  /api/runs/{run_id}/events:
    get:
      summary: SSE event stream for a run
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream
  /api/prompts/{prompt_id}/answer:
    post:
      summary: Answer a pending prompt
      parameters:
        - name: prompt_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Accepted
  /api/history:
    get:
      summary: List history items
      responses:
        "200":
          description: History list
  /api/history/{item_id}:
    get:
      summary: One history item
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: History item
        "404":
          description: Not found
    delete:
      summary: Remove a run from the history
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
        "404":
          description: Not found
  /api/config:
    get:
      summary: Global and project config
      responses:
        "200":
          description: Config payload
