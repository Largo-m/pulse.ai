[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-cursor-task"
version = "0.1.0"
description = "Execução interativa de tarefas Cursor com streaming e geração de artefatos via SKILL.md"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cursor-sdk>=0.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cursor-task = "cursor_task.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cursor_task*"]
