name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SECURITY_TOOLS: .claude/skills/security-audit/tools
  FORCE_COLOR: "1"

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      # The floor lives in [tool.coverage.report] fail_under.
      - run: pytest --cov --cov-report=term

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format github .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy
      - name: architecture invariants (AGENTS.md §2)
        run: pytest -q tests/architecture
      # Complexity (C901, max 10) is selected in ruff, so `ruff check` above blocks on it.
      - name: dead code
        run: vulture

  security:
    name: security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: sast-lite
        run: python "$SECURITY_TOOLS/sast-lite/analyzer.py" pulse/
      - name: secret-scanner
        run: python "$SECURITY_TOOLS/secret-scanner/engine.py" .
      # Lower bounds instead of pins are deliberate for a package (AGENTS.md §6.1).
      - name: dependency-check
        run: python "$SECURITY_TOOLS/dependency-check/checker.py" . --online --no-unpinned
