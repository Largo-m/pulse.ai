[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse"
version = "0.1.0"
description = "Terminal-first orchestrator for AI agent workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "pytest-randomly>=3.16",
    "hypothesis>=6.150",
    "httpx>=0.27",
    "ruff>=0.16",
    "mypy>=2.0",
    "vulture>=2.16",
    "import-linter>=2.15",
    "pre-commit>=4.0",
]

[project.scripts]
pulse = "pulse.cli.main:main"
pulse-engine = "pulse.daemon.server:main"
pulse-mcp-ask = "pulse.mcp.ask_stdio:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulse*"]

[tool.setuptools.package-data]
"pulse.store.factory" = ["agents/*/*.md", "shared/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude", ".agents", ".cursor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "ANN", "T20", "PT", "C90"]

[tool.ruff.lint.per-file-ignores]
# Policy: asserts are how pytest tests, and test functions are not public API.
"tests/**" = ["S101", "ANN"]
# Policy: these modules exist to write to the terminal.
"pulse/cli/daemon_command.py" = ["T201"]
"pulse/cli/main.py" = ["T201"]
"pulse/config/commands.py" = ["T201"]
"pulse/doctor/report.py" = ["T201"]
"pulse/cli/console_sink.py" = ["T201"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
files = ["pulse"]
warn_unused_ignores = true

# Policy: the domain, the engine and the reply parsers are `--strict` with no `Any` written or
# inferred in their code. `disallow_any_expr` stays off: typeshed types
# `re.Match.group` as `str | Any`.
[[tool.mypy.overrides]]
module = [
    "pulse.domain",
    "pulse.domain.*",
    "pulse.orchestrator",
    "pulse.orchestrator.*",
    "pulse.replies",
    "pulse.replies.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true

[tool.coverage.run]
source = ["pulse"]

[tool.coverage.report]
# Measured when the gate landed; each phase raises it, never lowers it.
fail_under = 84.3
precision = 2

[tool.vulture]
paths = ["pulse"]
min_confidence = 80

# Architecture fitness functions (AGENTS.md §2.1, §2.2); run by `lint-imports`
# and by tests/architecture/test_import_contracts.py.
[tool.importlinter]
root_package = "pulse"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "TUI and client are thin: they never import the engine"
type = "forbidden"
source_modules = ["pulse.tui", "pulse.client"]
forbidden_modules = ["pulse.orchestrator", "pulse.acp", "pulse.daemon"]
# Baseline: indirect chains that predate the contract; an entry that stops
# matching fails the check, so this list can only shrink.
ignore_imports = [
    # Settings and onboarding still list models by spawning ACP locally;
    # the fix is a models route in the daemon.
    "pulse.config.model_catalog -> pulse.acp.client",
    # Lazy import inside `model_request`, which only the session runner calls;
    # the fix is moving model-id parsing out of `acp/`.
    "pulse.runtimes.base -> pulse.acp.models",
    "pulse.runtimes.claude -> pulse.acp.models",
]

[[tool.importlinter.contracts]]
name = "Domain stays free of UI and web frameworks"
type = "forbidden"
source_modules = ["pulse.domain", "pulse.orchestrator", "pulse.replies"]
forbidden_modules = ["textual", "fastapi", "pulse.tui"]

[[tool.importlinter.contracts]]
name = "Domain values and reply parsing need nothing else from Pulse"
type = "forbidden"
source_modules = ["pulse.domain", "pulse.replies"]
forbidden_modules = [
    "pulse.acp",
    "pulse.api",
    "pulse.cli",
    "pulse.client",
    "pulse.config",
    "pulse.daemon",
    "pulse.doctor",
    "pulse.history",
    "pulse.mcp",
    "pulse.orchestrator",
    "pulse.runtimes",
    "pulse.store",
    "pulse.tui",
    "pulse.vcs",
]

[[tool.importlinter.contracts]]
name = "The engine reaches infrastructure only through ports"
type = "forbidden"
source_modules = ["pulse.orchestrator"]
forbidden_modules = ["pulse.acp", "pulse.store", "pulse.vcs", "pulse.doctor"]

[[tool.importlinter.contracts]]
name = "Only the CLI opens the TUI"
type = "forbidden"
source_modules = [
    "pulse.acp",
    "pulse.api",
    "pulse.client",
    "pulse.config",
    "pulse.daemon",
    "pulse.doctor",
    "pulse.domain",
    "pulse.history",
    "pulse.mcp",
    "pulse.orchestrator",
    "pulse.replies",
    "pulse.runtimes",
    "pulse.store",
    "pulse.vcs",
]
forbidden_modules = ["pulse.tui"]

[[tool.importlinter.contracts]]
name = "Only store/db.py loads the factory seed"
type = "protected"
protected_modules = ["pulse.store.factory"]
allowed_importers = ["pulse.store.db"]
