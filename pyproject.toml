[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse"
version = "0.1.0"
description = "Orquestrador terminal-first de workflows com agentes de IA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
pulse = "pulse.cli:main"
pulse-engine = "pulse.daemon.server:main"
pulse-mcp-ask = "pulse.mcp.ask_stdio:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
