[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse"
version = "0.1.0"
description = "Terminal-first orchestrator for AI agent workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "pytest-randomly>=3.16",
    "hypothesis>=6.150",
    "httpx>=0.27",
    "ruff>=0.16",
    "mypy>=2.0",
    "vulture>=2.16",
    "import-linter>=2.15",
    "mutmut>=3.3",
    "pre-commit>=4.0",
]

[project.scripts]
pulse = "pulse.cli.main:main"
pulse-engine = "pulse.daemon.server:main"
pulse-mcp-ask = "pulse.mcp.ask_stdio:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulse*"]

[tool.setuptools.package-data]
"pulse.store.factory" = ["agents/*/*.md", "shared/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude", ".agents", ".cursor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "ANN", "T20", "PT", "C90"]

[tool.ruff.lint.per-file-ignores]
# Policy: asserts are how pytest tests, and test functions are not public API.
"tests/**" = ["S101", "ANN"]
# Policy: these modules exist to write to the terminal.
"pulse/cli/daemon_command.py" = ["T201"]
"pulse/cli/main.py" = ["T201"]
"pulse/config/commands.py" = ["T201"]
"pulse/doctor/report.py" = ["T201"]
"pulse/cli/console_sink.py" = ["T201"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
files = ["pulse"]
warn_unused_ignores = true

# Policy: the domain, the engine and the reply parsers are `--strict` with no `Any` written or
# inferred in their code. `disallow_any_expr` stays off: typeshed types
# `re.Match.group` as `str | Any`.
[[tool.mypy.overrides]]
module = [
    "pulse.domain",
    "pulse.domain.*",
    "pulse.orchestrator",
    "pulse.orchestrator.*",
    "pulse.replies",
    "pulse.replies.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true

[tool.coverage.run]
source = ["pulse"]
branch = true

[tool.coverage.report]
# Measured when the gate landed; each phase raises it, never lowers it.
fail_under = 93.0
precision = 2

[tool.vulture]
paths = ["pulse"]
min_confidence = 80

# Architecture fitness functions (AGENTS.md §2.1, §2.2); run by `lint-imports`
# and by tests/architecture/test_import_contracts.py.
[tool.importlinter]
root_package = "pulse"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "TUI and client are thin: they never import the engine"
type = "forbidden"
source_modules = ["pulse.tui", "pulse.client"]
forbidden_modules = ["pulse.orchestrator", "pulse.acp", "pulse.daemon"]
# Baseline: indirect chains that predate the contract; an entry that stops
# matching fails the check, so this list can only shrink.
ignore_imports = [
    # Settings and onboarding still list models by spawning ACP locally;
    # the fix is a models route in the daemon.
    "pulse.config.model_catalog -> pulse.acp.client",
    # Lazy import inside `model_request`, which only the session runner calls;
    # the fix is moving model-id parsing out of `acp/`.
    "pulse.runtimes.base -> pulse.acp.models",
    "pulse.runtimes.claude -> pulse.acp.models",
]

[[tool.importlinter.contracts]]
name = "Domain stays free of UI and web frameworks"
type = "forbidden"
source_modules = ["pulse.domain", "pulse.orchestrator", "pulse.replies"]
forbidden_modules = ["textual", "fastapi", "pulse.tui"]

[[tool.importlinter.contracts]]
name = "Domain values and reply parsing need nothing else from Pulse"
type = "forbidden"
source_modules = ["pulse.domain", "pulse.replies"]
forbidden_modules = [
    "pulse.acp",
    "pulse.api",
    "pulse.cli",
    "pulse.client",
    "pulse.config",
    "pulse.daemon",
    "pulse.doctor",
    "pulse.history",
    "pulse.mcp",
    "pulse.orchestrator",
    "pulse.runtimes",
    "pulse.store",
    "pulse.tui",
    "pulse.vcs",
]

[[tool.importlinter.contracts]]
name = "The engine reaches infrastructure only through ports"
type = "forbidden"
source_modules = ["pulse.orchestrator"]
forbidden_modules = ["pulse.acp", "pulse.store", "pulse.vcs", "pulse.doctor"]

[[tool.importlinter.contracts]]
name = "Only the CLI opens the TUI"
type = "forbidden"
source_modules = [
    "pulse.acp",
    "pulse.api",
    "pulse.client",
    "pulse.config",
    "pulse.daemon",
    "pulse.doctor",
    "pulse.domain",
    "pulse.history",
    "pulse.mcp",
    "pulse.orchestrator",
    "pulse.replies",
    "pulse.runtimes",
    "pulse.store",
    "pulse.vcs",
]
forbidden_modules = ["pulse.tui"]

[[tool.importlinter.contracts]]
name = "The TUI reaches persistence, config and runtimes only through the daemon"
type = "forbidden"
source_modules = ["pulse.tui"]
forbidden_modules = ["pulse.store", "pulse.config", "pulse.doctor", "pulse.runtimes"]
# Direct imports only: indirect chains through `history/` are a separate debt.
allow_indirect_imports = true
# Baseline (shrink-only, ceiling pinned in tests/architecture/test_import_contracts.py).
ignore_imports = [
    # Settings and onboarding write SQLite directly; the fix is routing them
    # through `/api/config/*` plus agent and model routes in the daemon.
    "pulse.tui.screens.settings -> pulse.config",
    "pulse.tui.screens.settings -> pulse.config.global_config",
    "pulse.tui.screens.settings -> pulse.config.model_catalog",
    "pulse.tui.screens.settings -> pulse.config.project_config",
    "pulse.tui.screens.settings -> pulse.doctor.checks",
    "pulse.tui.screens.settings -> pulse.store.agent_settings",
    "pulse.tui.screens.settings -> pulse.store.workflow_defs",
    "pulse.tui.screens.onboarding -> pulse.config",
    "pulse.tui.screens.onboarding -> pulse.config.global_config",
    "pulse.tui.screens.onboarding -> pulse.config.model_catalog",
    "pulse.tui.screens.onboarding -> pulse.doctor.checks",
    "pulse.tui.screens.onboarding -> pulse.runtimes",
    "pulse.tui.screens.onboarding -> pulse.store.paths",
    # Reads of runs and workflow definitions the daemon already serves.
    "pulse.tui.hydrate -> pulse.store.runs",
    "pulse.tui.screens.cockpit -> pulse.store.runs",
    "pulse.tui.screens.home -> pulse.config",
    "pulse.tui.screens.home -> pulse.config.ready",
    "pulse.tui.screens.home -> pulse.store.workflow_defs",
]

[[tool.importlinter.contracts]]
name = "Adapters depend on the domain, not on each other"
type = "forbidden"
source_modules = ["pulse.acp", "pulse.mcp", "pulse.runtimes", "pulse.store", "pulse.vcs"]
forbidden_modules = [
    "pulse.acp",
    "pulse.config",
    "pulse.history",
    "pulse.mcp",
    "pulse.runtimes",
    "pulse.store",
    "pulse.vcs",
]
allow_indirect_imports = true
# Baseline (shrink-only, ceiling pinned in tests/architecture/test_import_contracts.py).
ignore_imports = [
    # The ACP session persists events and sessions itself; the fix is writing
    # them through `RunRepository` / `StreamSink` in `daemon/adapters.py`.
    "pulse.acp.run_events -> pulse.history.events",
    "pulse.acp.run_events -> pulse.history.prompt_detail",
    "pulse.acp.run_events -> pulse.history.tool_detail",
    "pulse.acp.run_events -> pulse.store.runs",
    "pulse.acp.session_runner -> pulse.store.sessions",
    # The session hosts the ask-question bridge and picks the runtime's argv.
    "pulse.acp.session_runner -> pulse.mcp.config",
    "pulse.acp.session_runner -> pulse.mcp.http_bridge",
    "pulse.acp.session_runner -> pulse.runtimes",
    # Model-id parsing is split between `acp/` and `runtimes/` (a cycle); the
    # fix is moving it into the `AgentRuntime` classes.
    "pulse.acp.models -> pulse.runtimes.claude",
    "pulse.runtimes.base -> pulse.acp.models",
    "pulse.runtimes.claude -> pulse.acp.models",
    "pulse.store.sessions -> pulse.config.project_config",
]

[[tool.importlinter.contracts]]
name = "Only store/db.py loads the factory seed"
type = "protected"
protected_modules = ["pulse.store.factory"]
allowed_importers = ["pulse.store.db"]

# Mutation testing of the parsers that read agent text (AGENTS.md §5.1, §6.1):
# `mutmut run`, `mutmut export-cicd-stats`, then `python scripts/mutation_gate.py --min 80`.
[tool.mutmut]
source_paths = ["pulse/"]
only_mutate = [
    "pulse/domain/outcome.py",
    "pulse/orchestrator/fanout.py",
    "pulse/orchestrator/render.py",
    "pulse/replies/*",
]
pytest_add_cli_args = ["-p", "no:randomly", "-p", "no:cacheprovider"]
# The prompt-injection corpus lives with the security-audit skill.
also_copy = [".claude/skills/security-audit/tools/prompt-injection-tester/"]
pytest_add_cli_args_test_selection = [
    "tests/domain",
    "tests/orchestrator",
    "tests/replies",
    "tests/architecture/test_prompt_injection.py",
]
