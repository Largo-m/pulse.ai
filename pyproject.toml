[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse"
version = "0.1.0"
description = "Terminal-first orchestrator for AI agent workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
pulse = "pulse.cli:main"
pulse-engine = "pulse.daemon.server:main"
pulse-mcp-ask = "pulse.mcp.ask_stdio:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulse*"]

[tool.setuptools.package-data]
"pulse.store.factory" = ["agents/*/*.md", "shared/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude", ".agents", ".cursor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "ANN", "T20", "PT"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
files = ["pulse"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["pulse"]
branch = false

[tool.coverage.report]
fail_under = 76
