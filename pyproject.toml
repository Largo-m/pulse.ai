[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse"
version = "0.1.0"
description = "Terminal-first orchestrator for AI agent workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "hypothesis>=6.150",
    "httpx>=0.27",
    "ruff>=0.16",
    "mypy>=2.0",
    "vulture>=2.16",
    "import-linter>=2.15",
    "pre-commit>=4.0",
]

[project.scripts]
pulse = "pulse.cli.main:main"
pulse-engine = "pulse.daemon.server:main"
pulse-mcp-ask = "pulse.mcp.ask_stdio:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulse*"]

[tool.setuptools.package-data]
"pulse.store.factory" = ["agents/*/*.md", "shared/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude", ".agents", ".cursor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "ANN", "T20", "PT"]

[tool.ruff.lint.per-file-ignores]
# Policy: asserts are how pytest tests, and test functions are not public API.
"tests/**" = ["S101", "ANN"]
# Policy: these modules exist to write to the terminal.
"pulse/cli/daemon_command.py" = ["T201", "BLE001"]  # baseline: BLE001
"pulse/cli/main.py" = ["T201", "BLE001"]  # baseline: BLE001
"pulse/config/commands.py" = ["T201"]
"pulse/doctor/report.py" = ["T201"]
"pulse/cli/console_sink.py" = ["T201"]

# Baseline: findings that predate the quality gates, one entry per file.
# Phase 7 zeroes this list; never add to it — fix the code or add a justified noqa.
"pulse/acp/run_events.py" = ["ANN401", "BLE001", "S110"]
"pulse/acp/session_runner.py" = ["ANN001", "ANN401", "BLE001", "S110"]
"pulse/api/app.py" = ["ANN202", "ANN401"]
"pulse/client/active_runs.py" = ["BLE001"]
"pulse/client/engine_client.py" = ["ANN401", "BLE001"]
"pulse/client/run_session.py" = ["ANN401", "BLE001", "S110"]
"pulse/config/agents.py" = ["ANN401"]
"pulse/daemon/adapters.py" = ["ANN401"]
"pulse/daemon/events.py" = ["ANN401", "BLE001"]
"pulse/daemon/runs.py" = ["ANN401", "BLE001", "S101"]
"pulse/domain/ports.py" = ["ANN401"]
"pulse/history/events.py" = ["UP042"]
"pulse/history/models.py" = ["UP042"]
"pulse/history/prompt_detail.py" = ["ANN401"]
"pulse/history/tool_detail.py" = ["BLE001", "S110"]
"pulse/mcp/ask_bridge.py" = ["ANN001", "S108"]
"pulse/mcp/ask_protocol.py" = ["ANN001", "ANN401"]
"pulse/mcp/http_bridge.py" = ["ANN001", "ANN401"]
"pulse/orchestrator/engine.py" = ["ANN401"]
"pulse/replies/permission.py" = ["ANN401"]
"pulse/store/agent_settings.py" = ["ANN001"]
"pulse/store/factory/__init__.py" = ["ANN401"]
"pulse/store/runs.py" = ["ANN401"]
"pulse/store/workflow_defs.py" = ["ANN401"]
"pulse/tui/__init__.py" = ["ANN202"]
"pulse/tui/adapters/prompt_bridge.py" = ["ANN401", "UP042"]
"pulse/tui/cursor_store.py" = ["BLE001", "S112"]
"pulse/tui/screens/cockpit.py" = ["ANN001", "BLE001", "S110"]
"pulse/tui/screens/history.py" = ["BLE001", "S110"]
"pulse/tui/screens/home.py" = ["BLE001", "S110"]
"pulse/tui/widgets/app_footer.py" = ["ANN003"]
"pulse/tui/widgets/app_header.py" = ["BLE001", "S110"]
"pulse/tui/widgets/artifact_pane.py" = ["ANN003", "BLE001"]
"pulse/tui/widgets/log_stream.py" = ["ANN003", "BLE001"]
"pulse/tui/widgets/phase_sidebar.py" = ["ANN003", "BLE001"]
"pulse/tui/widgets/prompt_dock.py" = ["ANN003"]
"tests/api/test_api_engine.py" = ["S108"]
"tests/client/test_engine_run_session.py" = ["S108"]
"tests/config/test_resolved_config.py" = ["S108"]
"tests/domain/test_run_model.py" = ["S108"]
"tests/infra/test_acp_client.py" = ["S108"]
"tests/infra/test_ask_bridge.py" = ["S108"]
"tests/infra/test_run_store.py" = ["S108"]
"tests/infra/test_session_runner.py" = ["S108"]
"tests/orchestrator/test_fanout.py" = ["F811"]
"tests/orchestrator/test_run_context.py" = ["S108"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
files = ["pulse"]
warn_unused_ignores = true

# Policy: the domain is `--strict` with no `Any` written or inferred in its code.
# `disallow_any_expr` stays off: typeshed types `re.Match.group` as `str | Any`.
[[tool.mypy.overrides]]
module = ["pulse.domain", "pulse.domain.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true

# Baseline: mypy errors that predate the quality gates, grouped by error code.
# Phase 7 zeroes this list; never add to it.
[[tool.mypy.overrides]]
module = [
    "pulse.config.global_config",
    "pulse.config.project_config",
    "pulse.daemon.adapters",
    "pulse.history.prompt_detail",
    "pulse.mcp.ask_stdio",
    "pulse.orchestrator.engine",
]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = [
    "pulse.acp.session_runner",
]
disable_error_code = ["arg-type", "assignment"]

[[tool.mypy.overrides]]
module = [
    "pulse.tui.screens.settings",
]
disable_error_code = ["arg-type", "attr-defined"]

[[tool.mypy.overrides]]
module = [
    "pulse.history.tool_detail",
    "pulse.tui.widgets.prompt_dock",
]
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = [
    "pulse.tui.screens.cockpit",
]
disable_error_code = ["assignment", "attr-defined"]

[[tool.mypy.overrides]]
module = [
    "pulse.acp.run_events",
    "pulse.tui.screens.history",
    "pulse.tui.screens.history_detail",
    "pulse.tui.screens.home",
]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = [
    "pulse.tui.hydrate",
]
disable_error_code = ["attr-defined", "call-overload"]

[[tool.mypy.overrides]]
module = [
    "pulse.acp.client",
]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = [
    "pulse.mcp.http_bridge",
]
disable_error_code = ["str-bytes-safe"]

[[tool.mypy.overrides]]
module = [
    "pulse.tui.cursor_store",
]
disable_error_code = ["union-attr"]

[tool.coverage.run]
source = ["pulse"]

[tool.coverage.report]
# Measured when the gate landed; each phase raises it, never lowers it.
fail_under = 76.8
precision = 2

[tool.vulture]
paths = ["pulse"]
min_confidence = 80

# Architecture fitness functions (AGENTS.md §2.1, §2.2); run by `lint-imports`
# and by tests/architecture/test_import_contracts.py.
[tool.importlinter]
root_package = "pulse"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "TUI and client are thin: they never import the engine"
type = "forbidden"
source_modules = ["pulse.tui", "pulse.client"]
forbidden_modules = ["pulse.orchestrator", "pulse.acp", "pulse.daemon"]
# Baseline: indirect chains that predate the contract; an entry that stops
# matching fails the check, so this list can only shrink.
ignore_imports = [
    # Settings and onboarding still list models by spawning ACP locally;
    # the fix is a models route in the daemon.
    "pulse.config.model_catalog -> pulse.acp.client",
    # Lazy import inside `model_request`, which only the session runner calls;
    # the fix is moving model-id parsing out of `acp/`.
    "pulse.runtimes.base -> pulse.acp.models",
    "pulse.runtimes.claude -> pulse.acp.models",
]

[[tool.importlinter.contracts]]
name = "Domain stays free of UI and web frameworks"
type = "forbidden"
source_modules = ["pulse.domain", "pulse.orchestrator", "pulse.replies"]
forbidden_modules = ["textual", "fastapi", "pulse.tui"]

[[tool.importlinter.contracts]]
name = "Domain values and reply parsing need nothing else from Pulse"
type = "forbidden"
source_modules = ["pulse.domain", "pulse.replies"]
forbidden_modules = [
    "pulse.acp",
    "pulse.api",
    "pulse.cli",
    "pulse.client",
    "pulse.config",
    "pulse.daemon",
    "pulse.doctor",
    "pulse.history",
    "pulse.mcp",
    "pulse.orchestrator",
    "pulse.runtimes",
    "pulse.store",
    "pulse.tui",
    "pulse.vcs",
]

[[tool.importlinter.contracts]]
name = "Only the CLI opens the TUI"
type = "forbidden"
source_modules = [
    "pulse.acp",
    "pulse.api",
    "pulse.client",
    "pulse.config",
    "pulse.daemon",
    "pulse.doctor",
    "pulse.domain",
    "pulse.history",
    "pulse.mcp",
    "pulse.orchestrator",
    "pulse.replies",
    "pulse.runtimes",
    "pulse.store",
    "pulse.vcs",
]
forbidden_modules = ["pulse.tui"]

[[tool.importlinter.contracts]]
name = "Only store/db.py loads the factory seed"
type = "protected"
protected_modules = ["pulse.store.factory"]
allowed_importers = ["pulse.store.db"]
